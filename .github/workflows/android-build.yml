name: Android CI Build

on:
  push:
    branches: [ "feature/minicpm-v-integration" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 确保 llama.cpp 被正确拉取

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Android NDK
      run: echo "NDK is pre-installed on GitHub Actions runners"

    - name: Build with Gradle (Debug APK)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: manga-translator-minicpm-v-debug
        path: app/build/outputs/apk/debug/app-debug.apk
